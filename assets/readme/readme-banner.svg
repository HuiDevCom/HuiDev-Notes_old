<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">风绘笔记 / HuiDev Notes</title>
  <desc id="banner-desc">用代码构建，用文字记录 — 个人技术博客，基于 Astro 和 Firefly 主题构建</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3f5"/>
      <stop offset="100%" stop-color="#f0edef"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e85a7a"/>
      <stop offset="100%" stop-color="#f0788a"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <rect x="26" y="30" width="28" height="28" rx="6"/>
    </clipPath>
  </defs>

  <!-- 主卡片容器 -->
  <rect width="1200" height="800" rx="24" fill="url(#bgGrad)"/>

  <!-- 顶部 Hero 区域 -->
  <!-- 分类徽章 -->
  <rect x="64" y="52" width="172" height="28" rx="14" fill="#e85a7a" opacity="0.1"/>
  <text x="150" y="71" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#e85a7a" font-weight="600">Personal Tech Blog</text>

  <!-- 主标题 -->
  <text x="64" y="135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="56" fill="url(#primaryGrad)" font-weight="700" letter-spacing="2">风绘笔记</text>
  <text x="64" y="185" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" fill="#2d2a2c" font-weight="300" letter-spacing="1">HuiDev Notes</text>

  <!-- 描述 -->
  <text x="64" y="240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#6b6668" font-weight="400">用代码构建，用文字记录</text>

  <!-- 网址 -->
  <text x="64" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8a8588">huidev.com</text>

  <!-- 分隔线 -->
  <line x1="64" y1="308" x2="344" y2="308" stroke="#e0dce0" stroke-width="1"/>

  <!-- 技术栈 -->
  <text x="64" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a09ba0">Astro 7 · TypeScript · Tailwind CSS 4</text>

  <!-- 右侧博客卡片预览 -->
  <g transform="translate(720, 56)">
    <rect width="380" height="288" rx="16" fill="#ffffff" stroke="#e8e4e7" stroke-width="1"/>
    <path d="M16 0 L364 0 Q380 0 380 16 L380 4 Q380 0 364 0 Z" fill="url(#primaryGrad)"/>
    <image href="../../public/favicon.png" x="26" y="30" width="28" height="28" clip-path="url(#avatarClip)"/>
    <rect x="64" y="36" width="120" height="7" rx="3.5" fill="#f0edef"/>
    <rect x="24" y="60" width="332" height="140" rx="10" fill="#f5f3f5"/>
    <rect x="24" y="216" width="200" height="6" rx="3" fill="#f0edef"/>
    <rect x="24" y="232" width="280" height="6" rx="3" fill="#f0edef"/>
    <rect x="24" y="258" width="332" height="1" fill="#f0edef" opacity="0.5"/>
    <circle cx="36" cy="276" r="3" fill="#e0dce0"/>
    <circle cx="56" cy="276" r="3" fill="#e0dce0"/>
    <circle cx="76" cy="276" r="3" fill="#e0dce0"/>
  </g>

  <!-- 跨全宽分隔线 -->
  <line x1="64" y1="400" x2="1136" y2="400" stroke="#e0dce0" stroke-width="1"/>

  <!-- 左栏：关于本站 -->
  <g transform="translate(64, 430)">
    <!-- 章节标题：粉色短竖线 + 中文标题 + 英文副标题 -->
    <line x1="0" y1="6" x2="0" y2="36" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="14" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#2d2a2c" font-weight="600">关于本站</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#a09ba0" font-weight="400">About This Site</text>

    <!-- 描述文本 -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#2d2a2c" font-weight="400">
      风绘笔记是个人技术博客，基于
      <tspan fill="#e85a7a" font-weight="500"> Astro </tspan>
      静态站点框架
    </text>
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#2d2a2c" font-weight="400">
      构建，使用
      <tspan fill="#e85a7a" font-weight="500"> Firefly </tspan>
      主题
    </text>

    <!-- 博客地址 -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#6b6668" font-weight="400">博客地址</text>
    <text x="0" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="url(#primaryGrad)" font-weight="500">huidev.com</text>
  </g>

  <!-- 竖向分隔线（左右栏之间） -->
  <line x1="620" y1="430" x2="620" y2="720" stroke="#e0dce0" stroke-width="1"/>

  <!-- 右栏：许可协议 -->
  <g transform="translate(684, 430)">
    <!-- 章节标题 -->
    <line x1="0" y1="6" x2="0" y2="36" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="14" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" fill="#2d2a2c" font-weight="600">许可协议</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#a09ba0" font-weight="400">License</text>

    <!-- 许可项 1 -->
    <circle cx="8" cy="98" r="4" fill="#e85a7a"/>
    <text x="24" y="103" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#2d2a2c" font-weight="400">
      本项目基于
      <tspan fill="#e85a7a" font-weight="500"> MIT License </tspan>
      开源
    </text>

    <!-- 许可项 2 -->
    <circle cx="8" cy="134" r="4" fill="#e85a7a"/>
    <text x="24" y="139" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16" fill="#2d2a2c" font-weight="400">
      本站文章
      <tspan fill="#e85a7a" font-weight="500"> CC BY-NC-SA 4.0 </tspan>
      授权
    </text>
  </g>

  <!-- 底部装饰：粉色渐变细线 -->
  <line x1="64" y1="755" x2="1136" y2="755" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>